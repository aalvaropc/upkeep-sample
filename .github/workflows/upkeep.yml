name: upkeep

on:
  workflow_dispatch:
    inputs:
      pull-requests:
        description: Pull requests to work, as numbers separated by commas; empty works every open one
        required: false
        default: ""
      dry-run:
        description: Push, comment and merge nothing
        type: boolean
        default: false
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write

jobs:
  queue:
    name: queue
    if: github.event_name != 'issue_comment'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    concurrency:
      group: upkeep
      cancel-in-progress: false
    steps:
      - uses: aalvaropc/upkeep@v0.2.2
        with:
          pull-requests: ${{ inputs.pull-requests }}
          dry-run: ${{ inputs.dry-run || false }}
          nebius-api-key: ${{ secrets.NEBIUS_API_KEY }}
          tavily-api-key: ${{ secrets.TAVILY_API_KEY }}
          github-token: ${{ secrets.UPKEEP_GITHUB_TOKEN }}

  comment:
    name: comment
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/upkeep') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: upkeep
      cancel-in-progress: false
    steps:
      - uses: aalvaropc/upkeep@v0.2.2
        with:
          pull-requests: ${{ github.event.issue.number }}
          nebius-api-key: ${{ secrets.NEBIUS_API_KEY }}
          tavily-api-key: ${{ secrets.TAVILY_API_KEY }}
          github-token: ${{ secrets.UPKEEP_GITHUB_TOKEN }}
